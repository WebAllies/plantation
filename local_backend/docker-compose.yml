services:
  postgres:
    image: postgres:16-alpine
    container_name: plantation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: plantation
      POSTGRES_USER: plantation
      POSTGRES_PASSWORD: plantation
    ports:
      - "5432:5432"
    volumes:
      - plantation-postgres-data:/var/lib/postgresql/data

volumes:
  plantation-postgres-data:
